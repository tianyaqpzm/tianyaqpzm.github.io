[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "py_demo"
version = "0.0.0"
description = "Small demo package for LeetCode 79 word search"
authors = [ { name = "your-name" } ]
requires-python = ">=3.8"
dependencies = [
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
where = ["src"]

